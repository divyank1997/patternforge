services:
  postgres:
    image: postgres:16-alpine
    container_name: patternforge-postgres
    environment:
      POSTGRES_USER: patternforge
      POSTGRES_PASSWORD: patternforge
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patternforge -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
